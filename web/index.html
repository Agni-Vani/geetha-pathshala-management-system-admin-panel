<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Matches the browser/status bar chrome to the app's top bar color
       (#FAFCFB) instead of the Flutter-template default blue. -->
  <meta name="theme-color" content="#FAFCFB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="geetha_pathshala_management_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>geetha_pathshala_management_web</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter Web draws the browser's default focus ring around the
       canvas/glass-pane on keyboard (Tab) focus. Suppress it since the
       app renders its own focus/border styling for form fields. */
    flt-glass-pane, flutter-view, canvas, *:focus {
      outline: none !important;
    }

    /* Matches the page background to the app's top bar color so there's no
       color seam behind the status bar/notch on mobile before Flutter's
       canvas paints. */
    html, body {
      background-color: #FAFCFB;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
